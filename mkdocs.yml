site_name: Ludmila / ATHIS-DF — Assessoria Técnica em Habitação de Interesse Social
site_description: Acompanhamento da parceria com Dra. Ludmila Correia (CAU DF) — projetos, seminários, editais e articulação ATHIS
site_url: https://takwaratec.github.io/ludmila-athis-df
repo_url: https://github.com/takwaratec/ludmila-athis-df
repo_name: takwaratec/ludmila-athis-df
edit_uri: edit/main/docs/
copyright: "(c) Tecnologia Takwara, 2026. CC BY 4.0"

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: slate
      primary: deep-orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Modo claro
    - scheme: default
      primary: deep-orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Modo escuro
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - footnotes
  - tables
  - attr_list
  - md_in_html

plugins:
  - search

exclude_docs: |
  transcricoes/decupagem-conversa-ludmila-2021-2025.md

nav:
  - "Inicio": index.md
  - "Histórico e andamento": historico-andamentos-2026.md
  - "Realinhamento": diagnostico-realinhamento-2026.md
  - "Reconhecimento - 8 de agosto": visita-sol-nascente-2026-08-08.md
  - "Oportunidades": oportunidades.md
  - "App triagem REURB": app-triagem-regularizacao-athis.md
  - "Zayed - Sol Nascente": zayed-sol-nascente-2027.md
  - "ATA 07/07/2026": atas/2026-07-07_ATA_ALINHAMENTO_FORMACAO_ATHIS.md
  - "Memória":
      - "Conversa de julho de 2026": transcricoes/decupagem-ludmila-julho-2026.md
      - "Abertura 17/07/2026": transcricoes/decupagem-abertura-2026-07-17.md
      - "Seminário ATHIS 2024-2026": transcricoes/decupagem-seminario-athis-2024-2026.md
